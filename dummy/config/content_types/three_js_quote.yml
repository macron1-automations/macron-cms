fields:
  - name: 'text'
    kind: 'string'
  - name: 'color'
    kind: 'color'
  - name: 'rotation_axis'
    kind: 'dropdown'
    options:
      - name: 'X Axis'
        value: 'x'
      - name: 'Y Axis'
        value: 'y'
      - name: 'Z Axis'
        value: 'z'
  - name: 'font_size'
    kind: 'dropdown'
    options:
      - name: 'Small'
        value: 'sm'
      - name: 'Medium'
        value: 'md'
      - name: 'Large'
        value: 'lg'
      - name: 'Extra Large'
        value: 'xl'
  - name: 'font'
    kind: 'dropdown'
    options:
      - name: 'Helvetiker (Sans-serif)'
        value: 'helvetiker'
      - name: 'Optimer (Modern Sans)'
        value: 'optimer'
      - name: 'Gentilis (Humanist Sans)'
        value: 'gentilis'
      - name: 'Droid Serif (Serif)'
        value: 'droid_serif'
  - name: 'background_color'
    kind: 'color'
  - name: 'upload'
    kind: 'file'
  - name: 'background_mode'
    kind: 'dropdown'
    options:
      - name: 'Stretch'
        value: 'stretch'
      - name: 'Tile'
        value: 'tile'
