fields:
  - name: 'upload'
    kind: 'file'
  - name: 'size'
    kind: 'dropdown'
    options:
      - name: 'Small (33%)'
        value: 'sm'
      - name: 'Medium (50%)'
        value: 'md'
      - name: 'Large (75%)'
        value: 'lg'
      - name: 'Full Width (100%)'
        value: 'full'
  - name: 'height'
    kind: 'dropdown'
    options:
      - name: 'Large (480px)'
        value: 'lg'
      - name: 'Extra Large (640px)'
        value: 'xl'
      - name: 'Very Large (800px)'
        value: '2xl'
